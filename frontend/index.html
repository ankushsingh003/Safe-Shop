<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeShop SOC — ML Fraud Intelligence Platform</title>
    <meta name="description" content="Real-time ML fraud detection and cyber security operations center for SafeShop e-commerce platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-base:         #0a0c10;
        --bg-surface:      #0f1117;
        --bg-card:         #141720;
        --bg-card-hover:   #181c26;
        --bg-elevated:     #1c2030;
        --border:          rgba(255,255,255,0.07);
        --border-bright:   rgba(255,255,255,0.13);

        --text-primary:    #e8eaf0;
        --text-secondary:  #7c8399;
        --text-muted:      #4a5168;
        --text-accent:     #a8b4cc;

        --accent-blue:     #3b82f6;
        --accent-blue-dim: rgba(59,130,246,0.15);
        --accent-cyan:     #06b6d4;
        --accent-cyan-dim: rgba(6,182,212,0.12);
        --accent-purple:   #8b5cf6;
        --accent-purple-dim: rgba(139,92,246,0.15);
        --accent-emerald:  #10b981;
        --accent-emerald-dim: rgba(16,185,129,0.12);

        --red:             #ef4444;
        --red-dim:         rgba(239,68,68,0.15);
        --red-bright:      #f87171;
        --orange:          #f59e0b;
        --orange-dim:      rgba(245,158,11,0.12);
        --yellow:          #eab308;
        --green:           #22c55e;
        --green-dim:       rgba(34,197,94,0.12);

        --sidebar-w:       220px;
        --topbar-h:        52px;
        --font-mono:       'JetBrains Mono', 'Fira Code', monospace;
        --font-sans:       'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --radius-sm:       4px;
        --radius-md:       8px;
        --radius-lg:       12px;

        --glow-red:        0 0 20px rgba(239,68,68,0.25);
        --glow-blue:       0 0 20px rgba(59,130,246,0.2);
        --glow-green:      0 0 20px rgba(34,197,94,0.2);
      }

      html, body { height: 100%; }

      body {
        font-family: var(--font-sans);
        background: var(--bg-base);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      #root { height: 100%; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-base); }
      ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }

      /* Scanline overlay for authentic feel */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.03) 2px,
          rgba(0,0,0,0.03) 4px
        );
        pointer-events: none;
        z-index: 9999;
      }

      input, button, select, textarea {
        font-family: inherit;
        font-size: 13px;
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text-primary);
        outline: none;
        cursor: pointer;
        border-radius: var(--radius-sm);
        padding: 6px 10px;
        transition: all 0.15s ease;
      }
      input { cursor: text; }
      input:focus {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
      }
      button:hover:not(:disabled) {
        background: var(--bg-card-hover);
        border-color: var(--border-bright);
      }
      button:active:not(:disabled) { transform: scale(0.97); }
      button:disabled { opacity: 0.35; cursor: not-allowed; }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      @keyframes slide-in-right {
        from { transform: translateX(10px); opacity: 0; }
        to   { transform: translateX(0);    opacity: 1; }
      }

      @keyframes fade-up {
        from { transform: translateY(8px); opacity: 0; }
        to   { transform: translateY(0);   opacity: 1; }
      }

      @keyframes count-up {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes threat-ping {
        0%   { transform: scale(1); opacity: 1; }
        100% { transform: scale(2.5); opacity: 0; }
      }

      @keyframes blink-critical {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.5; }
      }

      @keyframes scan-line {
        0%   { top: -2px; }
        100% { top: 100%; }
      }

      @keyframes popup-in {
        from { opacity: 0; transform: scale(0.96) translateY(8px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
      }

      .animate-fade-up { animation: fade-up 0.3s ease forwards; }
      .animate-slide-right { animation: slide-in-right 0.25s ease forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
